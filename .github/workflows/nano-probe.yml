name: Nano on free public runners
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: nano-probe-${{ github.ref }}
  cancel-in-progress: false
jobs:
  probe:
    # These are standard public x64 runners, never larger/GPU/paid runners.
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install repository dependencies
        run: npm ci --ignore-scripts
      - name: Install isolated probe driver (no repository dependency edits)
        run: npm install --prefix scripts/nano-ci/.driver --no-package-lock --ignore-scripts playwright@1.58.2
      - name: Install genuine Google Chrome Stable
        run: node scripts/nano-ci/.driver/node_modules/playwright/cli.js install chrome
      - name: Hardware and storage inventory
        shell: bash
        run: node scripts/nano-ci/hardware.mjs
      - name: Bundle local-only SDK page
        run: node scripts/nano-ci/build.mjs
      - name: Headed Chrome Linux probe
        if: runner.os == 'Linux'
        run: xvfb-run -a node scripts/nano-ci/probe.mjs
      - name: Headed Chrome Windows probe
        if: runner.os == 'Windows'
        run: node scripts/nano-ci/probe.mjs
      - name: Preserve evidence even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nano-probe-${{ matrix.os }}-${{ github.run_id }}
          path: scripts/nano-ci/artifacts/
          if-no-files-found: warn
          retention-days: 7
