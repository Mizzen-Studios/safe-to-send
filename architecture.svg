<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 590" role="img" aria-labelledby="title desc">
<title id="title">Safe to Send: explicit privacy boundary</title><desc id="desc">Raw content stays in the browser. On-device detection and regex lead to mandatory review. Only approved redacted synthetic fixture data reaches an isolated Firebase AI Logic broker. Nano execution remains unverified.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#36564c"/></marker></defs>
<rect width="1000" height="590" fill="#faf9f5"/><rect x="20" y="65" width="620" height="490" rx="12" fill="#eaf3ee"/><rect x="670" y="65" width="310" height="490" rx="12" fill="#eef0f6"/>
<g font-family="system-ui,sans-serif" fill="#18362c"><text x="30" y="35" font-size="24" font-weight="700">Your letter is not the cloud prompt.</text><text x="45" y="100" font-size="19">RAW ORIGIN · browser memory</text><text x="695" y="100" font-size="19">ISOLATED BROKER ORIGIN</text></g>
<g stroke="#36564c" stroke-width="2" fill="none" marker-end="url(#arrow)"><path d="M310 177V210"/><path d="M310 285V320"/><path d="M570 365H700"/><path d="M825 400V430"/><path d="M700 475H570"/></g>
<g stroke="#82988e" fill="#fff"><rect x="60" y="120" width="510" height="57" rx="8"/><rect x="60" y="210" width="510" height="75" rx="8"/><rect x="60" y="320" width="510" height="90" rx="8"/><rect x="60" y="440" width="510" height="70" rx="8"/><rect x="700" y="320" width="250" height="80" rx="8"/><rect x="700" y="430" width="250" height="80" rx="8"/></g>
<g font-family="system-ui,sans-serif" font-size="17" fill="#18362c"><text x="85" y="155">Synthetic text / locally rendered image</text><text x="85" y="240">firebase/ai ONLY_ON_DEVICE + regex union</text><text x="85" y="265" font-size="14" fill="#8a4814">Nano adapter implemented · real execution NOT_RUN</text><text x="85" y="350">Mandatory review → exact redacted JSON approval</text><text x="85" y="380" font-size="14">Revision-bound · five unchanged fixtures only for cloud</text><text x="85" y="468">Local placeholder restoration + editable draft</text><text x="85" y="493" font-size="14">Original / image / mapping never passed to broker</text><text x="725" y="349">App Check → AI Logic</text><text x="725" y="378" font-size="15">ONLY_IN_CLOUD</text><text x="725" y="458">Response + body ledger</text><text x="725" y="487" font-size="14">UTF-8 bytes + SHA-256</text><text x="45" y="535" font-size="14">No raw-content cloud fallback. This is a design diagram, not inference evidence.</text></g></svg>
